name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Helektra
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Check plugin JAR
        run: |
          echo "Plugin target:"
          ls -lah plugin/target/

      - name: Rename plugin JAR
        run: |
          JAR=$(find plugin/target -maxdepth 1 -type f -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)

          if [ -z "$JAR" ]; then
            echo "Plugin JAR not found!"
            exit 1
          fi

          cp "$JAR" Helektra.jar

          echo "Generated:"
          ls -lah Helektra.jar

      - name: Upload Helektra artifact
        uses: actions/upload-artifact@v4
        with:
          name: Helektra
          path: Helektra.jar

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Helektra
        uses: actions/download-artifact@v4
        with:
          name: Helektra
          path: release

      - name: Get Maven version
        id: version
        run: |
          VERSION=$(mvn help:evaluate \
            -Dexpression=project.version \
            -q \
            -DforceStdout)

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            release/Helektra.jar
